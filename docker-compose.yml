# ------------------------------------------------------------------
# Cara pakai:
#   1) Hanya PostgreSQL + Redis (disarankan saat pengembangan harian):
#        docker compose up -d
#   2) Semua layanan di dalam Docker (backend, worker, frontend juga):
#        docker compose --profile full up --build
# ------------------------------------------------------------------
services:
  db:
    image: postgres:16
    container_name: gwasena-db
    environment:
      POSTGRES_USER: gwasena
      POSTGRES_PASSWORD: gwasena
      POSTGRES_DB: gwasena
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gwasena -d gwasena"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: gwasena-redis
    ports:
      - "6379:6379"

  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: gwasena-backend
    environment:
      DATABASE_URL: postgresql+psycopg://gwasena:gwasena@db:5432/gwasena
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./pipeline:/app/pipeline
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: gwasena-worker
    environment:
      DATABASE_URL: postgresql+psycopg://gwasena:gwasena@db:5432/gwasena
      REDIS_URL: redis://redis:6379/0
    command: celery -A backend.tasks.celery_app:celery_app worker --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./pipeline:/app/pipeline
      - ./storage:/app/storage
    depends_on:
      - redis
      - db

  frontend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: gwasena-frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
